# Groups the generated release notes by PR label.
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Breaking changes
      labels: [breaking]
    - title: New features
      labels: [enhancement]
    - title: Bug fixes
      labels: [bug]
    - title: Security
      labels: [security]
    - title: Dependencies
      labels: [dependencies]
    - title: Documentation
      labels: [documentation]
    - title: CI and tooling
      labels: [ci]
    - title: Other changes
      labels: ["*"]
